[project]
name = "unisoc"
version = "0.1.0"
description = "Spreadtrum/Unisoc firmware dump & flash tool (BSL protocol client)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "loguru>=0.7.3",
    "prompt-toolkit>=3.0.0",
    "pyserial>=3.5",
    "pyusb>=1.3.1",
    "rich>=15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spd_dump"]

[project.scripts]
spd = "spd_dump.__main__:main"

[dependency-groups]
dev = [
    "loguru>=0.7.3",
    "pytest>=9.1.1",
    "rich>=15.0.0",
    "ruff>=0.16.7",
]
